services:
  postgres:
    image: postgres:16-alpine
    container_name: sizzle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sizzle
    ports:
      - "5432:5432"
    volumes:
      - sizzle-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sizzle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sizzle-pgdata:
